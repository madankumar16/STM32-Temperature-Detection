name: Project CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-diagnostics:
    name: Python diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python syntax
        run: python -m compileall -q AI_Diagnostics
      - name: Run diagnostic unit checks
        working-directory: AI_Diagnostics
        run: |
          python - <<'PY'
          from diagnostic_engine import diagnose

          checks = [
              (37.2, 462, "NORMAL"),
              (30.0, 372, "LOW_TEMPERATURE"),
              (45.0, 558, "HIGH_TEMPERATURE"),
              (37.2, 0, "SENSOR_LOW_OR_DISCONNECTED"),
              (37.2, 4095, "SENSOR_HIGH_OR_SHORT"),
              (-1.0, 100, "TEMPERATURE_OUT_OF_RANGE"),
              (81.0, 100, "TEMPERATURE_OUT_OF_RANGE"),
          ]
          for temperature, raw, expected in checks:
              actual = diagnose(temperature, raw).fault
              assert actual == expected, (
                  f"temperature={temperature}, raw={raw}: "
                  f"expected {expected}, got {actual}"
              )
          print(f"All {len(checks)} diagnostic cases passed.")
          PY
      - name: CLI smoke checks
        working-directory: AI_Diagnostics
        run: |
          python diagnostic_engine.py --temperature 37.2 --raw 462
          python diagnostic_engine.py --temperature 30.0 --raw 372
          python diagnostic_engine.py --temperature 45.0 --raw 558
          python diagnostic_engine.py --temperature 37.2 --raw 0
          python diagnostic_engine.py --temperature 37.2 --raw 4095

  firmware-source-check:
    name: STM32 source and configuration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify firmware source files
        run: |
          test -f STM32_Project/Core/Src/main.c
          test -f STM32_Project/Core/Inc/main.h
          test -f STM32_Project/Drivers/LM35/lm35.c
          test -f STM32_Project/Drivers/LM35/lm35.h
          test -f STM32_Project/Drivers/LCD/lcd.c
          test -f STM32_Project/Drivers/LCD/lcd.h
          test -f STM32_Project/Drivers/Buzzer/buzzer.c
          test -f STM32_Project/Drivers/Buzzer/buzzer.h
          test -f STM32_Project/Drivers/LED/led.c
          test -f STM32_Project/Drivers/LED/led.h
          test -f STM32_Project/STM32_Temperature.ioc
          test -f STM32_Project/Core/Src/stm32f1xx_it.c
          test -f STM32_Project/Makefile
          test -f STM32_Project/App/temp_logic.c
          test -f STM32_Project/App/temp_logic.h
      - name: Check project pin mapping and ADC configuration
        run: |
          grep -q 'ADC_CHANNEL_0' STM32_Project/Core/Src/main.c
          grep -q 'GPIO_PIN_0' STM32_Project/Core/Src/main.c
          grep -q 'LM35_ADC_MAX_VALUE' STM32_Project/App/temp_logic.h
          grep -q 'PA0.*ADC1_IN0' STM32_Project/STM32_Temperature.ioc
          grep -q 'PB0.*GPIO_Output (Buzzer)' STM32_Project/STM32_Temperature.ioc

  host-unit-tests:
    name: Host unit tests (temperature logic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build and run tests with gcc
        run: make -C STM32_Project test

  stm32-firmware-syntax:
    name: STM32 firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout STM32 HAL
        uses: actions/checkout@v4
        with:
          repository: STMicroelectronics/stm32f1xx_hal_driver
          path: third_party/hal

      - name: Checkout STM32 device headers
        uses: actions/checkout@v4
        with:
          repository: STMicroelectronics/cmsis_device_f1
          path: third_party/device

      - name: Checkout CMSIS core headers
        uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS_5
          path: third_party/CMSIS_5

      - name: Install ARM GNU compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build and link firmware image
        working-directory: STM32_Project
        run: make

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32-temperature-firmware
          path: |
            STM32_Project/build/stm32_temperature.bin
            STM32_Project/build/stm32_temperature.hex
            STM32_Project/build/stm32_temperature.elf

<text x="545" y="315" font-size="28" font-weight="bold">STM32F103C8T6</text>
<text x="560" y="365" font-size="20">ADC1_IN0 / PA0</text>
<text x="560" y="400" font-size="20">GPIO LCD control</text>
<text x="560" y="435" font-size="20">PB0 → Buzzer</text>
<text x="560" y="470" font-size="20">PB1 → Alarm LED</text>
